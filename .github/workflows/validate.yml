name: Validate educational playbook
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check synthetic examples
        run: python3 labs/scripts/validate_fixture.py
      - name: Evaluate retrieval fixture
        run: python3 labs/scripts/evaluate_retrieval.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Markdown links and demo contacts
        run: python3 labs/scripts/check_content.py
